%YAML:1.0

# Camera model used by src/alpha/model/alpha.sdf.
File.version: "1.0"
Camera.type: "PinHole"

Camera1.fx: 608.852
Camera1.fy: 607.976
Camera1.cx: 331.662
Camera1.cy: 251.412
Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0

Camera.width: 640
Camera.height: 480
# Match the D435i-style RGB-D stream (colour + aligned depth) generated by
# src/alpha/model/alpha.sdf.
Camera.fps: 30
Camera.RGB: 1

# ORB-SLAM3 uses the nominal stereo baseline to convert the dimensionless
# close/far threshold into a metric depth cutoff, including in RGB-D mode.
Stereo.b: 0.0499585
Stereo.ThDepth: 30.0

# Depth arrives as 16UC1 millimetres (D435i aligned depth); 0 means invalid.
RGBD.DepthMapFactor: 1000.0
RGBD.NearThresh: 0.1
RGBD.FarThresh: 5.0

# Camera-to-body transform: maps points in the colour optical frame
# (right-down-forward) into the body frame, which here is the D435i camera IMU
# (BMI055) frame camera_imu_optical_frame. Both frames share the optical axes,
# so the rotation is identity. The translation is the colour lens origin seen
# from the IMU, taken from the same D435i offsets as the camera_imu sensor in
# src/alpha/model/alpha.sdf (IMU at (+0.02052, -0.0051, -0.01174) m in the
# colour optical frame). Simulation geometry only; re-check on a real camera.
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [ 1.0, 0.0, 0.0, -0.02052,
           0.0, 1.0, 0.0,  0.0051,
           0.0, 0.0, 1.0,  0.01174,
           0.0, 0.0, 0.0,  1.0 ]

# Minimum acceleration excitation used by inertial initialization. This matches
# the established RGB-D-inertial profile while permitting Gazebo initialization.
IMU.Threshold: 0.1
# Match the 200 Hz camera IMU stream (/camera/camera/imu) of the Alpha model.
IMU.Frequency: 200.0
# Continuous-time densities; the loader scales them by sqrt(Frequency).
# White noise: BMI055 datasheet (gyro rad/s/sqrt(Hz), accel m/s^2/sqrt(Hz)).
IMU.NoiseGyro: 2.4435e-4
IMU.NoiseAcc: 1.4710e-3
# Bias random walk (rad/s^2/sqrt(Hz), m/s^3/sqrt(Hz)): real D435i Kalibr values.
IMU.GyroWalk: 3.8744e-5
IMU.AccWalk: 7.4464e-4
# Require measurable acceleration excitation before creating the inertial map.
# This prevents stationary PX4 startup from creating an unobservable map that
# the local mapper must immediately discard.
IMU.FastInit: 0
IMU.InsertKFsWhenLost: 1

# Common deterministic tracking settings for both Alpha RGB-D modes.
Tracking.MinInliersForKF: 30
Tracking.MinCloseInliersForKF: 15
Tracking.MinTemporalSpacingKF: 1.5
Tracking.MaxKFsInLocalMap: 30
Tracking.MotionModelSearchRadiusMultiplier: 2.0
Tracking.MotionModelMaxSearchRadius: 30
Tracking.InitializationMinPoints: 100
Tracking.RelocalizationMinInliers: 10

ORBextractor.nFeatures: 2000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 10
ORBextractor.iniThFAST: 7
ORBextractor.minThFAST: 1
