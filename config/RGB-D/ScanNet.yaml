%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them! (ICL Dataset - https://peringlab.org/lmdata/)
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

# Rectified Camera calibration (OpenCV)
Camera1.fx: 577.870605
Camera1.fy: 577.870605
Camera1.cx: 319.5
Camera1.cy: 239.5

# Distortion parameters
Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0

# Camera resolution
Camera.width: 640
Camera.height: 480

# Camera frames per second 
Camera.fps: 30

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

Stereo.ThDepth: 10.0
Stereo.b: 0.0745

# RGBD parameters
RGBD.DepthMapFactor: 1000.0
RGBD.NearThresh: 0.4
RGBD.FarThresh: 3.5

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 1250
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
#--------------------------------------------------------------------------------------------
