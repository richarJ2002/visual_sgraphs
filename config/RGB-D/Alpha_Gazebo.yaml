%YAML:1.0

# Camera model used by src/alpha/model/alpha.sdf.
File.version: "1.0"
Camera.type: "PinHole"

Camera1.fx: 608.852
Camera1.fy: 607.976
Camera1.cx: 331.662
Camera1.cy: 251.412
Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0

Camera.width: 640
Camera.height: 480
# Match the RGB-D stream generated by src/alpha/model/alpha.sdf.
Camera.fps: 30
Camera.RGB: 1

# ORB-SLAM3 uses the nominal stereo baseline to convert the dimensionless
# close/far threshold into a metric depth cutoff, including in RGB-D mode.
Stereo.b: 0.0499585
Stereo.ThDepth: 30.0

RGBD.DepthMapFactor: 1.0
RGBD.NearThresh: 0.1
RGBD.FarThresh: 5.0

# Common deterministic tracking settings for both Alpha RGB-D modes.
Tracking.MinInliersForKF: 30
Tracking.MinCloseInliersForKF: 15
Tracking.MinTemporalSpacingKF: 1.5
Tracking.MaxKFsInLocalMap: 30
Tracking.MotionModelSearchRadiusMultiplier: 2.0
Tracking.MotionModelMaxSearchRadius: 30
Tracking.InitializationMinPoints: 100
Tracking.RelocalizationMinInliers: 10

ORBextractor.nFeatures: 2000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 10
ORBextractor.iniThFAST: 7
ORBextractor.minThFAST: 1

Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0
