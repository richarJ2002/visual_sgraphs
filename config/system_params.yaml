###############################################################################
# 📋 Table of Contents (auto-summary; keep in sync with top-level sections)  #
###############################################################################
# general:                      General mode & env database path              #
# markers:                      Marker trust impact                            #
# optimization:                 Plane-based optimization factors               #
# refine_map_points:            Refining map points using semantics            #
# plane_based_covisibility:     Plane-based covisibility graph config        #
# seg:                          Common segmentation parameters               #
# geo_seg:                      Geometric segmentation parameters              #
# sem_seg:                      Semantic segmentation parameters               #
# room_seg:                     Room segmentation parameters                 #
# room_tracking:                Room-tracking state machine (WP13 Section 18.4) #
# candidate_gen:                Candidate generation & topology              #
# verification:                 Geometric verification gates                   #
# factor:                     Edge-plane transform noise model                 #
# map_merge:                    Map merge & axiom thresholds      #
###############################################################################

################################ General Parameters #############################################
general:
  # Specify the mode of operation for the segmentation pipeline
  # 0: Semantic Segmentation runs in conjunction with Geometric Segmentation
  # 1: Semantic Segmentation runs independently
  # 2: Geometric Segmentation runs independently
  # run with 2 if semantic segmentation is not running - this clears the pointclouds
  mode_of_operation: 1

  # The path of the high level semantic information of the environment
  # [TODO] - the path looks ugly, possible workaround?
  env_database: ""

#################################### Marker Parameters ###########################################
markers:
  # How much the framework should trust the markers (0.1 default, higher for mono setups)
  impact: 0.1

################################## Optimization Parameters #######################################
optimization:
  marginalize_planes: false

  # plane to map point factor (needs marginalize_planes to be false)
  plane_map_point:
    enabled: true
    information_gain: 1.0
  # plane equation to keyframe factor
  plane_kf:
    enabled: false
    information_gain: 0.5
  # point to plane factor
  plane_point:
    enabled: true
    information_gain: 0.3

################################ Refining map points using semantics Parameters ##################
refine_map_points:
  enabled: true
  max_distance_for_delete: 0.1
  octree:
    resolution: 0.03
    search_radius: 0.03
    min_neighbors: 2

############################### Plane based covisibility graph Parameters #########################
plane_based_covisibility:
  enabled: false
  max_keyframes: 80 # the maximum number of keyframes to be considered for the covisibility graph
  score_per_plane: 80 # the score each semantic plane contributes to the covisibility graph

################################ Common Segmentation Parameters ##################################
seg:
  # Number of points (after filtering) needed to detect geometric objects (e.g., planes)
  # Also, the number of points needed to detect a plane in the pointcloud
  pointclouds_thresh: 350

  # Plane association
  plane_association:
    ominus_thresh: 0.18 # Max allowed combined orientation-and-distance difference
    distance_thresh: 0.12 # meters (Checks if planes are too far apart along normal direction)
    centroid_thresh: 2.5 # meters (Checks if planes centroids are too far apart - will enable check for clustring)
    cluster_separation:
      enabled: true
      tolerance: 0.35 # euclidean distance for cutting planes
      downsample:
        leaf_size: 0.08
        min_points_per_voxel: 2

  # The maximum distance for point to be considered part of a plane
  plane_point_dist_thresh: 0.02

  ransac:
    # The maximum number of planes to be detected in one pointcloud
    max_planes: 2

    # The maximum distance for a point to be considered an inlier of the plane model
    distance_thresh: 0.05

    # The maximum number of iterations for the RANSAC algorithm
    max_iterations: 800

############################ Geometric Segmentation Parameters ####################################
geo_seg:
  pointcloud:
    # pointcloud downsampling parmeters
    downsample:
      leaf_size: 0.08
      min_points_per_voxel: 10

############################## Semantic Segmentation Parameters ####################################
sem_seg:
  pointcloud:
    # pointcloud downsampling parmeters
    downsample:
      leaf_size: 0.04
      min_points_per_voxel: 10

  # The threshold for semantic segmentation probability validation. This tracks
  # the probability that pixel belongs to a semantic class and
  # rejects probability below this.
  prob_thresh: 0.5

  # The threshold for semantic segmentation confidence validation. This tracks
  # the confidence that the segmentation was correct and rejects confidence
  # below this.
  conf_thresh: 0.1

  # The maximum height above the main ground to be a valid stepped ground plane (in meters)
  max_step_elevation: 0.5

  # The maximum tilt heuristic for a wall/ground plane (checks respective component of plane equation)
  max_tilt_wall: 0.2
  max_tilt_ground: 0.2

  # ------------------ Door/Passage Parameters ------------------
  enable_passage_detection: true
  # Maximum wall to door distance for a door to be associated with a wall (in meters)
  max_wall_door_distance: 0.5
  # Maximum door width for a door to be valid (in meters)
  max_door_width: 1.25
  # Maximum door height for a door to be valid (in meters)
  max_door_height: 2.0
  # Maximum Keyframe to passage distance for checking passing through a passage (in meters)
  max_kf_passage_distance: 1.0
  # The size of the KeyFrame window to check for passing through a passage (in number of KeyFrames)
  passage_kf_window: 10
  # Passage centroid distance threshold for associating passages (in meters)
  passage_centroid_distance_thresh: 1.0

  # Open-passage evidence derived from Voxblox skeleton edges. A passage is
  # still detected before a room is complete, but a single noisy post-merge
  # skeleton snapshot is not sufficient to create a permanent graph entity.
  passage_detection:
    # Minimum signed distance of both edge endpoints from the wall (metres).
    minimum_side_distance: 0.15
    # Minimum alignment between the skeleton edge and wall normal.
    minimum_edge_normal_alignment: 0.50
    # Minimum empty in-plane radius at a candidate opening (metres).
    minimum_opening_radius: 0.30
    # Finite wall-bound tolerance used only for passage detection (metres).
    wall_bounds_margin: 0.10
    # Maximum distance for tracking the same opening across revisions (metres).
    duplicate_passage_distance: 1.00
    # Absolute normal dot product required for duplicate passage tracks.
    duplicate_normal_alignment: 0.90
    # Lower normal agreement which marks a nearby hypothesis as ambiguous.
    ambiguous_duplicate_normal_alignment: 0.70
    # Maximum wall-plane offset for suppressing an ambiguous duplicate (metres).
    ambiguous_duplicate_plane_separation: 0.75
    # Maximum separation between crossings forming one opening (metres).
    crossing_cluster_distance: 0.65
    # Number of distinct skeleton snapshots required for confirmation. No
    # longer gates passage creation (see minimum_crossing_cluster_size
    # below) -- retained only to cap the temporal-evidence smoothing weight.
    minimum_confirmation_snapshots: 4
    # Individual skeleton-edge crossings that must cluster into one opening
    # in a SINGLE cycle before a passage is created for it -- same-cycle
    # evidence-quantity gate, same semantic level/priority as a wall's own
    # admission (cluster point count / connectivity ratio). Enough of the
    # free-space skeleton breaking through the wall this cycle is
    # sufficient on its own; no separate multi-cycle waiting period.
    minimum_crossing_cluster_size: 2
    # Number of missed snapshots before an unconfirmed track is discarded.
    maximum_missed_snapshots: 4
    # Required observed wall extent on both horizontal sides of an opening.
    minimum_horizontal_flank_extent: 0.35
    # Minimum wall-cloud points required on each side of an opening.
    minimum_horizontal_flank_points: 12

  # The amount of votes (votes are weighted votes) for a plane to be finally classified with a semantic label
  min_votes: 1.0

  # Admission policy for a new persistent wall plane. Small observations may
  # still update an existing wall, but cannot independently become a wall.
  wall_creation:
    minimum_point_count: 350
    minimum_major_extent: 0.80 # metres
    minimum_minor_extent: 0.30 # metres
    minimum_area: 0.40 # square metres
    connectivity:
      enabled: true
      cluster_tolerance: 0.15 # metres
      minimum_component_point_count: 300
      # A wall's own doorway/window splits its single-frame mask into two
      # large, independently-valid fragments of near-equal size (ratio
      # ~0.50), not one dominant blob -- 0.70 rejected every such wall
      # outright. 0.40 clears that case with margin while still catching
      # genuinely scattered/sparse candidates.
      minimum_component_ratio: 0.40

  # Twin-face reconciliation: a physical wall can produce two independent
  # WALL Planes, one per face, distinguished by observationOrigin_World_m.
  # These thresholds decide when two such Planes are plausibly the two faces
  # of the same physical wall (SemanticsManager::reconcileWallFacePairs()).
  wall_pairing:
    minimum_thickness: 0.05 # metres -- thinnest plausible physical wall
    maximum_thickness: 0.60 # metres -- thickest plausible physical wall
    minimum_overlap_ratio: 0.30 # required in-plane footprint overlap

  # Whether to reassociate planes with the semantic labels - after optimization, some planes may get close
  reassociate:
    # Reconcile duplicate semantic planes after loop closure or map merge. The
    # fusion pass rewires Room, Passage, and KeyFrame references atomically
    # before retiring the weaker hypothesis.
    enabled: true
    association_thresh: 0.1
    wall_extension:
      # Merge adjacent finite fragments only after their equations and
      # observation sides have also been found compatible.
      enabled: true
      maximum_in_plane_gap: 1.25 # metres; includes a typical doorway opening
      minimum_orthogonal_overlap: 0.30 # metres

  ############################## Room Segmentation Parameters ####################################
room_seg:
  # The method to use for room segmentation
  # 0: Segment geometrically based on closest walls
  # 1: Segment based on free-space clustering (skeleton voxblox)
  # 2: Segment based on GNN (legacy)
  # 3: Segment based on GNN (new)
  method: 1

  # The minimum space between two given walls of a corridor/room (in meters) to be valid
  min_wall_distance_thresh: 1.0

  # The maximum threshold for the dot product of the plane normals to be considered facing each other
  plane_facing_dot_thresh: -0.9

  # Threshold for perpendicularity of two walls of a room (in degrees)
  perpendicularity_thresh: 10.0

  # Threshold for parallelism of two walls of a room (in degrees)
  parallelism_thresh: 10.0

  # The maximum distance between two room centroids to be considered the same room (in meters)
  center_distance_thresh: 2.0

  # [deprecated] Parameters for the geometrically-based closest walls room segmentation
  geo_based:
    # The maximum distance from a marker to a wall to be considered part of the room
    marker_wall_distance_thresh: 6.0

  # Parameters for skeleton voxblox free-space room segmentation
  skeleton_based:
    # The minimum number of points needed to form a cluster
    min_cluster_vertices: 5
    # The maximum distance from a point of a cluster to a wall to be considered part of the room
    cluster_point_wall_distance_thresh: 1.2
    # The maximum distance from the cluster centroid to a wall centroid to be considered part of the room
    cluster_centroid_wall_centroid_distance_thresh: 4.0
    # Minimum finite-wall support needed before linking a wall to a room
    minimum_wall_support_points: 2
    # Minimum keyframe observations needed before creating an orphan-wall structural element
    minimum_wall_observations: 3
    # Stale semantic cycles retained before an unused weak wall is retired.
    # A wall with no room, no passage association, and no growing evidence
    # should not persist as a floating orphan in the sgraph/visualization --
    # 1 is the minimum the retirement logic allows (the first sighting of
    # an undefended wall is always spared one cycle so newly-created
    # evidence isn't retired before room-creation logic in the same Run()
    # cycle gets a chance to claim it; this is the very next check after
    # that).
    minimum_undefended_wall_hold_cycles: 5
    # Fraction of nearby skeleton points which must project inside the observed wall bounds
    minimum_wall_support_ratio: 0.5
    # Tolerance around the observed finite wall bounds (metres)
    finite_wall_bounds_margin: 0.75
    # Minimum observed extent along each wall tangent axis (metres)
    minimum_finite_wall_extent: 1.0

# Finite-wall topology validation. Passage detection is independent: a
  # passage may be confirmed before either adjoining boundary is complete.
  boundary_topology:
    # Enable wall-clash repair and closed-boundary classification.
    enabled: true
    # Minimum number of finite wall segments needed to close a room boundary.
    minimum_wall_count: 3
    # Minimum robust horizontal wall length used by the boundary model (metres).
    minimum_wall_length: 0.5
    # Maximum unsupported extension from an observed wall end to a corner (metres).
    maximum_corner_gap: 1.0
    # Maximum distance an intersection may lie inside a wall before it is
    # treated as a clashing/T-junction association (metres).
    maximum_interior_intersection: 0.50
    # Minimum horizontal area enclosed by a complete room boundary (square metres).
    minimum_enclosed_area: 0.001
    # Fraction trimmed from each end of a wall projection to reject outliers.
    endpoint_trim_ratio: 0.02
    # Remove the weaker wall in a clash only when the stronger observation
    # score exceeds it by this ratio; otherwise retain both and flag conflict.
    decisive_conflict_support_ratio: 1.3

  # Split connected Voxblox free space at confirmed openings. This prevents a
  # skeleton component which traverses a doorway from assigning destination-
  # room walls to the room on the other side. It does not gate room creation or
  # passage detection on boundary completeness.
  passage_partition:
    enabled: true
    # Maximum edge-endpoint to skeleton-vertex association error (metres).
    edge_vertex_association_distance: 0.15
    # Fall back to the original component if too little graph is reconstructed.
    minimum_graph_coverage_ratio: 0.65
    # Extra half-width/half-height around a passage used to cut an edge (metres).
    opening_margin: 0.20
    # Minimum edge-endpoint distance from the passage plane (metres).
    minimum_side_distance: 0.10
    # Remove an existing wall association proven to lie through an opening.
    detach_walls_beyond_passages: true
    # Minimum room/wall centroid distance from opposite passage sides (metres).
    wall_centroid_minimum_side_distance: 0.30

  # Parameters for GNN-based room segmentation
  gnn_based:
    # Version of the GNN-based room segmentation to use
    gnn_version: 1 # 1: Older version used in S-Graphs, 2: Newer version used in VS-Graphs

# Room-tracking state machine (WP13 Section 18.4). Calibration-dependent
# initial values; tunned against the simulated office_clean survey.
room_tracking:
  # Minimum continuous dwell in the crossing guard before committing the
  # CONFIRMED_ROOM <-> CROSSING_PASSAGE transitions (seconds).
  crossing_dwell_s: 2.0
  # Minimum traversal confidence (0..1) for a crossing to count.
  crossing_confidence: 0.7
  # Maximum time in LOST_WITH_LAST_ROOM before decay to LOST_WITHOUT_ROOM (s).
  lost_timeout_s: 30.0
  # Maximum time in REACQUIRING_IN_NEW_MAP before decay to LOST_WITHOUT_ROOM (s).
  reacquire_timeout_s: 60.0
  # Retry backoff between failed reacquire attempts (seconds).
  reacquire_retry_interval_s: 5.0
  # Maximum failed reacquire attempts before timeout applies.
  reacquire_max_retries: 3
  # Minimum planes required to attempt a reacquire.
  reacquire_min_planes: 3

candidate_gen:
  top_k: 10
  candidate_pair_cap: 1000
  topology_nodes_cap: 128
  global_fallback_cap: 1000
  weight_angle: 1.0
  weight_extent: 1.0
  weight_aperture: 1.0
  weight_topology: 1.0
  angle_missing_penalty: 1.0
  extent_missing_penalty: 1.0
  aperture_missing_penalty: 1.0
  ambiguity_margin: 0.05
  angle_tolerance_rad: 1.0e-9
  runtime_budget_ms: 0.0
  descriptor_elements_cap: 4096
  topo_refinement_iters: 3

verification:
  max_normal_angle_deg: 10.0
  max_offset_m: 0.35
  max_support_dist_m: 0.25
  min_inlier_ratio: 0.6
  max_condition_number: 100.0
  ambiguity_margin_inliers: 1
  max_walls_per_room: 16
  max_hypotheses: 2000
  max_support_sample_per_wall: 64
  min_abs_cos_normal_angle: 0.85

factor:
  sigma_theta_rad: 0.05
  sigma_offset_m: 0.05
  huber_delta: 1.345
  optimizer_iterations: 20

# Map-merge & axiom thresholds
map_merge:
  # Fixed spherical tolerance for passage association across maps (metres)
  passage_match_tolerance_m: 0.20
  # Wall coplanarity angle threshold (degrees); planes within this angle are
  # considered coplanar and merge-eligible.
  wall_coplanar_angle_deg: 5.0
  # Edges within this distance count as overlapping / the same wall.
  wall_edge_overlap_m: 0.50
  # Floor match tolerance for through-doorway wall axiom (metres).
  floor_match_tolerance_m: 0.10
  # Max first-to-latest observation origins checked by the through-doorway
  # wall axiom.
  observation_ray_check_cap: 5
  # Cooldown between consecutive-map merge attempts for the same old map (s).
  merge_cooldown_s: 30
  # Minimum tag-matched anchor rooms required to estimate alignment.
  min_anchor_rooms: 2
  # Minimum rooms required in each map before attempting a match.
  min_rooms_per_map: 1
  # Minimum walls required in each map before attempting a match.
  min_walls_per_map: 3
  # Maximum anchor-room centroid distance after alignment (metres). Rooms
  # are matched by tag; this only bounds residual centre drift.
  room_centroid_tolerance_m: 0.50
